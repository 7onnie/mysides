name: Release

on:
  push:
    tags:
      - "v*"
  # Notausgang: Lauf ohne neuen Tag nachholen. Die Version MUSS mitgegeben
  # werden - sie kam bisher aus GITHUB_REF_NAME, und das waere bei einem
  # Dispatch auf main schlicht "main" (Release-Name "vmain").
  workflow_dispatch:
    inputs:
      version:
        description: "Version des bestehenden Tags, mit oder ohne fuehrendes v (z.B. 1.2.3)"
        required: true
        type: string

jobs:
  build-and-release:
    name: Build arm64 binary and update Homebrew formula
    runs-on: macos-14          # Apple Silicon runner, builds arm64 natively
    # 10x-Runner: ohne Limit kostet ein Haenger 360 x 10 = 3600 abgerechnete
    # Minuten, mehr als ein Monatskontingent. Beobachtet ~3 min.
    timeout-minutes: 20

    permissions:
      contents: write          # needed to upload release assets

    steps:
      - name: Get version and tag
        id: version
        env:
          # Ueber env statt direkt als ${{ }} im Script-Text: der Input ist
          # freier Text und im Script waere er eine Injektionsstelle.
          _Input: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${_Input}" ]
          then
            _Version="${_Input#v}"       # nimmt "1.2.3" und "v1.2.3"
          else
            _Version="${GITHUB_REF_NAME#v}"
          fi
          _Tag="v${_Version}"

          # Ohne Tag kein Ziel fuer die Assets - lieber hier mit klarer Meldung
          # abbrechen als spaeter beim Checkout oder beim Upload.
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${_Tag}" >/dev/null 2>&1
          then
            echo "ERROR: Tag ${_Tag} existiert nicht."
            exit 1
          fi

          echo "Version: ${_Version} (Tag ${_Tag})"
          echo "version=${_Version}" >> "$GITHUB_OUTPUT"
          echo "tag=${_Tag}"         >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ausdruecklich den Tag auschecken: bei einem Dispatch stuende sonst
          # main im Workspace und das Binary passte nicht zur Version.
          ref: ${{ steps.version.outputs.tag }}

      - name: Build arm64
        run: swift build -c release --arch arm64

      - name: Verify architecture
        run: |
          # arm64-only per BUILD-POLICY.md (7onnie/.github) — fail if x86_64 slipped in
          lipo -info .build/arm64-apple-macosx/release/mysides
          lipo -info .build/arm64-apple-macosx/release/mysides | grep -qv x86_64

      - name: Package tarball
        id: package
        run: |
          _Version="${{ steps.version.outputs.version }}"
          _TarName="mysides-${_Version}-arm64.tar.gz"
          _TmpDir="$(mktemp -d)/mysides-${_Version}"
          mkdir -p "${_TmpDir}"
          cp .build/arm64-apple-macosx/release/mysides "${_TmpDir}/mysides"
          # Exclude macOS extended attributes so the tarball is reproducible
          tar -czf "${_TarName}" --no-xattrs -C "$(dirname ${_TmpDir})" "mysides-${_Version}"
          echo "tarball=${_TarName}" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.tarball }}" \
            --clobber

      - name: Compute SHA256 from GitHub-served file
        id: sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          _Version="${{ steps.version.outputs.version }}"
          _TarName="${{ steps.package.outputs.tarball }}"
          _URL="https://github.com/7onnie/mysides/releases/download/v${_Version}/${_TarName}"
          # Wait for GitHub CDN to propagate the upload (90s avoids stale-node hash mismatches)
          sleep 90
          echo "sha256=$(curl -sL ${_URL} | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          _Version="${{ steps.version.outputs.version }}"
          _SHA256="${{ steps.sha256.outputs.sha256 }}"
          _TarName="${{ steps.package.outputs.tarball }}"

          git clone https://x-access-token:${GH_TOKEN}@github.com/7onnie/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          cat > Formula/mysides.rb << FORMULA
          class Mysides < Formula
            desc "CLI tool for managing the macOS Finder sidebar favorites"
            homepage "https://github.com/7onnie/mysides"
            url "https://github.com/7onnie/mysides/releases/download/v${_Version}/${_TarName}"
            sha256 "${_SHA256}"
            version "${_Version}"
            license "MIT"

            depends_on :macos => :ventura
            depends_on arch: :arm

            def install
              bin.install "mysides"
            end

            test do
              assert_match "mysides ${_Version}", shell_output("#{bin}/mysides version")
            end
          end
          FORMULA

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mysides.rb
          git commit -m "mysides ${_Version}"
          git push
